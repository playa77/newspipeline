[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newspipeline-client"
version = "0.5.0"
description = "Desktop GUI client for managing a newspipeline server over an SSH tunnel"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "PySide6~=6.7",
    "httpx~=0.28",
]

[project.scripts]
newspipeline-client = "newspipeline_client.app:main"

[tool.setuptools.packages.find]
where = ["src"]
