[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newspipeline"
version = "0.2.0"
description = "Standalone local news pipeline agent: RSS scraping, LLM theme analysis, content generation, email/file delivery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "flask~=3.1",
    "httpx~=0.28",
    "feedparser~=6.0",
    "trafilatura~=2.0",
    "tomli-w~=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
]

[project.scripts]
newspipeline = "newspipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"newspipeline.web" = ["templates/*", "static/*"]
